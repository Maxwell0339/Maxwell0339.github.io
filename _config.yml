# 站点信息
title: "Maxwell's Blog"
subtitle: 记录技术，也记录生活
description: 技术学习与实践、项目开发过程，以及日常生活中的思考。
author: Maxwell
language: zh-CN
timezone: Asia/Shanghai

# GitHub 用户主页部署在域名根目录
url: https://maxwell0339.github.io
root: /
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
skip_render:
  - robots.txt

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false
prismjs:
  enable: false

index_generator:
  path: ''
  per_page: 10
  order_by: -date
default_category: 未分类
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date
per_page: 10
pagination_dir: page
theme: butterfly

search:
  path: search.xml
  field: all
  content: true
  format: html
sitemap:
  path: sitemap.xml
  rel: false

# 发布由 .github/workflows/pages.yml 完成
deploy:
  type: ''
